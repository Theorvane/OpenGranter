name: Change proposal
description: Propose a change. Start the title with feat:, fix:, docs:, chore:, ci:, or security: for automatic labeling.
title: ""
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List success, denial, and failure paths when applicable.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Constraints or references
      description: Include relevant documents, compatibility needs, or open decisions.
    validations:
      required: false
