name: Container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        network: [host, bridge]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag opengranter:test .
      - name: Check runtime files, dependencies and non-root identity
        run: |
          docker run --rm --read-only --entrypoint node opengranter:test --input-type=module -e '
            import assert from "node:assert/strict";
            import { access, readdir } from "node:fs/promises";
            assert.notEqual(process.getuid(), 0);
            await import("pg");
            await import("jose");
            assert.ok((await readdir("migrations")).some(name => name.endsWith(".sql")));
            for (const path of ["node_modules/typescript", "node_modules/@electric-sql/pglite", ".git", "test", "docs"]) {
              await assert.rejects(access(path));
            }
          '
      - name: Refuse missing bootstrap
        run: |
          set +e
          docker run --rm --read-only opengranter:test > missing.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "Gateway configuration invalid" missing.log
      - name: Start disposable gateway and terminate gracefully
        shell: bash
        env:
          CONTAINER_NETWORK_MODE: ${{ matrix.network }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          chmod 755 "$fixture"
          trap 'docker rm -f opengranter-smoke >/dev/null 2>&1 || true; rm -rf "$fixture"' EXIT
          cat > "$fixture/bootstrap.mjs" <<'MODULE'
          import { createPostgresConnection } from "/app/src/storage/postgres-connection.ts";
          export function createGatewayPorts() {
            return {
              openConnection: () => createPostgresConnection({ connectionString: "postgresql://postgres@" + process.env.PGHOST + ":5432/postgres" }),
              checkLimit: async () => false,
              resolveSecret: async () => { throw new Error("No provider credentials in smoke test"); }
            };
          }
          MODULE
          chmod 644 "$fixture/bootstrap.mjs"
          network_args=(--network host)
          pg_host=127.0.0.1
          if [[ "$CONTAINER_NETWORK_MODE" == bridge ]]; then
            network=$(docker inspect --format '{{range $name, $config := .NetworkSettings.Networks}}{{$name}}{{end}}' "$POSTGRES_CONTAINER")
            pg_host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")
            test -n "$network"
            test -n "$pg_host"
            network_args=(--network "$network" --publish 127.0.0.1:18080:18080 -e OPENGRANTER_HOST=0.0.0.0)
          fi
          launch_gateway() {
            docker run -d --name opengranter-smoke --read-only --cap-drop ALL \
              --security-opt no-new-privileges "${network_args[@]}" -e PGHOST="$pg_host" \
              --mount "type=bind,src=$fixture,dst=/bootstrap,readonly" \
              -e OPENGRANTER_BOOTSTRAP_MODULE=/bootstrap/bootstrap.mjs \
              -e OPENGRANTER_PORT=18080 -e OPENGRANTER_SHUTDOWN_MS=30000 opengranter:test
          }
          launch_gateway
          for attempt in $(seq 1 60); do
            if docker logs opengranter-smoke 2>&1 | grep -q "Gateway listening"; then break; fi
            sleep 1
          done
          docker logs opengranter-smoke 2>&1 | grep -q "Gateway listening"
          # Seed only an inert application row; deny-all ports remain unchanged.
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            "INSERT INTO catalog_models (alias, created_at_seconds, enabled) VALUES ('restart-probe', 0, false)"
          migration_history_before=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
            "SELECT version, checksum, applied_at_ms FROM schema_migrations ORDER BY version")
          test -n "$migration_history_before"
          for phase in initial restarted restored database_restarted recreated; do
            if [[ "$phase" == restored ]]; then
              # Cold logical backup/restore of disposable CI data only.
              test "$(docker inspect --format '{{.State.Running}}' opengranter-smoke)" = false
              (umask 077; docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres --format=custom --no-owner --no-privileges postgres > "$fixture/recovery.dump")
              test -s "$fixture/recovery.dump"
              chmod 600 "$fixture/recovery.dump"
              docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
                "DELETE FROM catalog_models WHERE alias = 'restart-probe'"
              deleted_model=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT alias, enabled FROM catalog_models WHERE alias = 'restart-probe'")
              test -z "$deleted_model"
              docker exec -i "$POSTGRES_CONTAINER" pg_restore -U postgres --exit-on-error --clean --if-exists --no-owner --no-privileges -d postgres < "$fixture/recovery.dump"
              # Assert before startup: migration or reseeding cannot hide a bad restore.
              restored_model=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT alias, enabled FROM catalog_models WHERE alias = 'restart-probe'")
              test "$restored_model" = "restart-probe|f"
              restored_history=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT version, checksum, applied_at_ms FROM schema_migrations ORDER BY version")
              test "$migration_history_before" = "$restored_history"
            fi
            if [[ "$phase" == database_restarted ]]; then
              # Same disposable database container, not volume-loss recovery.
              test "$(docker inspect --format '{{.State.Running}}' opengranter-smoke)" = false
              docker stop --time 40 "$POSTGRES_CONTAINER"
              test "$(docker inspect --format '{{.State.ExitCode}}' "$POSTGRES_CONTAINER")" = 0
              docker start "$POSTGRES_CONTAINER"
              database_ready=false
              for attempt in $(seq 1 60); do
                if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then
                  database_ready=true
                  break
                fi
                sleep 1
              done
              test "$database_ready" = true
              # Assert before gateway startup can apply migrations or reseed.
              restarted_model=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT alias, enabled FROM catalog_models WHERE alias = 'restart-probe'")
              test "$restarted_model" = "restart-probe|f"
              restarted_history=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT version, checksum, applied_at_ms FROM schema_migrations ORDER BY version")
              test "$migration_history_before" = "$restarted_history"
            fi
            if [[ "$phase" == recreated ]]; then
              # Replace only the stopped gateway; retain the same database and image.
              test "$(docker inspect --format '{{.State.Running}}' opengranter-smoke)" = false
              old_gateway_id=$(docker inspect --format '{{.Id}}' opengranter-smoke)
              test -n "$old_gateway_id"
              docker rm opengranter-smoke
              # Verify before replacement startup can migrate or seed anything.
              replacement_model=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT alias, enabled FROM catalog_models WHERE alias = 'restart-probe'")
              test "$replacement_model" = "restart-probe|f"
              replacement_history=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
                "SELECT version, checksum, applied_at_ms FROM schema_migrations ORDER BY version")
              test "$migration_history_before" = "$replacement_history"
              launch_gateway
              new_gateway_id=$(docker inspect --format '{{.Id}}' opengranter-smoke)
              test -n "$new_gateway_id"
              test "$old_gateway_id" != "$new_gateway_id"
            elif test "$phase" != initial; then
              docker start opengranter-smoke
            fi
            # Poll HTTP, not the listening log retained from the previous process.
            status=000
            for attempt in $(seq 1 60); do
              status=$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/models) || status=000
              if [[ "$status" == 401 ]]; then break; fi
              sleep 1
            done
            test "$status" = 401
            persisted_model=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
              "SELECT alias, enabled FROM catalog_models WHERE alias = 'restart-probe'")
            test "$persisted_model" = "restart-probe|f"
            migration_history_after=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -At -v ON_ERROR_STOP=1 -c \
              "SELECT version, checksum, applied_at_ms FROM schema_migrations ORDER BY version")
            test "$migration_history_before" = "$migration_history_after"
            docker stop --time 40 opengranter-smoke
            test "$(docker inspect --format '{{.State.ExitCode}}' opengranter-smoke)" = 0
          done
